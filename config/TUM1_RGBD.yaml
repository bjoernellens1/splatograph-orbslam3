%YAML:1.0
# ORB-SLAM3 RGB-D config for TUM freiburg1 sequences (fr1_room, fr1_desk, ...).
# Intrinsics + distortion from the TUM benchmark (ORB-SLAM3 ships these as the
# Monocular TUM1.yaml). DEPTH NOTE: the ros2-converted TUM bags publish
# /camera/depth/image as 32FC1 in METRES (verified by `ros2 topic echo --field
# encoding`), so DepthMapFactor is 1.0 here -- NOT the 5000 of the original
# 16UC1-mm PNG dataset. Camera.RGB: 1 because the bag is rgb8.
File.version: "1.0"
Camera.type: "PinHole"

Camera1.fx: 517.306408
Camera1.fy: 516.469215
Camera1.cx: 318.643040
Camera1.cy: 255.313989
Camera1.k1: 0.262383
Camera1.k2: -0.953104
Camera1.p1: -0.005358
Camera1.p2: 0.002628
Camera1.k3: 1.163314

Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

# RGB-D
RGBD.DepthMapFactor: 1.0
Stereo.b: 0.0773
Stereo.ThDepth: 40.0

# ORB (TUM standard)
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Viewer (Pangolin disabled at runtime)
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
